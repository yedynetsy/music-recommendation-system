[project]
name = "music-recommendation-system"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "psycopg[binary]>=3.2,<3.3",
    "fastapi==0.162.5",
    "uvicorn>=0.54,<0.55",
    "sqlalchemy>=2.0.57,<2.1",
    "alembic>=1.20,<2",
    "implicit==0.7.3",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "threadpoolctl>=3.8,<4",
]

[project.optional-dependencies]
demo = [
    "httpx>=0.28,<0.29",
    "streamlit>=1.64,<1.65",
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.28,<0.29",
    "streamlit>=1.64,<1.65",
]

[tool.setuptools.packages.find]
include = ["fastapi_app*", "recommendations*", "music_demo*", "scripts*"]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
